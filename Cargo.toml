[package]
name = "koi-desktop"
description = "Koi's desktop workbench: a friendly native shell over the local substrate"
publish = false
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sylin-org/koi-desktop"
build = "build.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.5", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-notification = "=2.3.1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
base64 = "0.22"
qrcode = "0.14"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[patch.crates-io]
# Tauri 2.11 still selects Tao 0.35.3, whose custom Wayland header diverges
# from KDE's native decoration. Use Tao's merged upstream fix, as proven by
# Ghostlight on the same CachyOS Plasma workstation, until Tauri selects 0.36+.
tao = { git = "https://github.com/tauri-apps/tao", rev = "07f3742b1833b64be27b1ef991e38d557d4276c9" }
